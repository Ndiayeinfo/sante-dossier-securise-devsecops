# Jenkins pour le Projet 2 (pipeline sur dossier-sante-api).
# Port 8098 : l'application Spring Boot utilise déjà 8090.
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sante-dossier-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8098:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"

volumes:
  jenkins_home:
