# Jenkins + SonarQube (Projet 2 — DevSecOps).
# Ports : 8098 Jenkins, 9000 SonarQube (API Spring Boot : 8090).
services:
  sonarqube:
    image: sonarqube:community
    container_name: sante-dossier-sonarqube
    hostname: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sante-dossier-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8098:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    depends_on:
      - sonarqube

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
